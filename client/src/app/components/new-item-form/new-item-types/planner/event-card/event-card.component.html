<form class="event-card-dialog" [formGroup]="form" (ngSubmit)="onSubmit()">
    <!-- HEADER -->
    <div class="event-card-header">
        <div
            class="event-card-icon-wrap"
            [style.background-color]="sessionTypeColor">
            <mat-icon class="event-card-icon">
                event
            </mat-icon>
        </div>

        <div class="event-card-header-main">
            <input
                matInput
                placeholder="Session title"
                [formControl]="form.get('title')"
                class="event-card-title-input" />

            <div class="event-card-subtitle">
                {{ headerSubtitle }}
            </div>
        </div>
    </div>



    <mat-divider></mat-divider>

    <!-- BODY -->
    <div class="event-card-body">
        <!-- SESSION DETAILS -->
        <div class="event-card-section">
            <div class="section-title">Session Details</div>

            <div class="details-grid">
                <!-- Date -->
                <mat-form-field appearance="fill">
                    <mat-label>Date</mat-label>
                    <input
                        matInput
                        [matDatepicker]="pickerDate"
                        formControlName="date" />
                    <mat-datepicker-toggle matSuffix [for]="pickerDate"></mat-datepicker-toggle>
                    <mat-datepicker #pickerDate></mat-datepicker>
                </mat-form-field>

                <!-- Time -->
                <mat-form-field appearance="fill">
                    <mat-label>Start Time</mat-label>
                    <input
                        matInput
                        type="time"
                        formControlName="time" />
                </mat-form-field>

                <!-- Duration -->
                <mat-form-field appearance="fill">
                    <mat-label>Duration</mat-label>
                    <mat-select formControlName="duration_minutes">
                        <mat-option
                            *ngFor="let d of durationOptions"
                            [value]="d.value">
                            {{ d.label }}
                        </mat-option>
                    </mat-select>
                </mat-form-field>

                <!-- Type -->
                <mat-form-field appearance="fill">
                    <mat-label>Session Type</mat-label>
                    <mat-select formControlName="session_type">
                        <mat-option
                            *ngFor="let t of sessionTypes"
                            [value]="t.value">
                            {{ t.label }}
                        </mat-option>
                    </mat-select>
                </mat-form-field>
            </div>
        </div>

        <!-- LOCATION & PEOPLE -->
        <div class="event-card-section">
            <div class="section-title">Location & People</div>

            <div class="details-grid two-columns">
                <mat-form-field appearance="fill">
                    <mat-label>Location</mat-label>
                    <input
                        matInput
                        placeholder="Venue, studio, address..."
                        formControlName="location" />
                </mat-form-field>

                <mat-form-field appearance="fill">
                    <mat-label>Attendees</mat-label>
                    <mat-select formControlName="attendees" multiple>
                        <mat-option
                            *ngFor="let m of members"
                            [value]="m.members?.id || m.id">
                            {{ m.members?.first_name || m.first_name }}
                            {{ m.members?.last_name || m.last_name }}
                        </mat-option>
                    </mat-select>
                </mat-form-field>
            </div>
        </div>

        <!-- NOTES -->
        <div class="event-card-section">
            <div class="section-title">Notes</div>
            <mat-form-field appearance="fill" class="full-width">
                <textarea
                    matInput
                    rows="5"
                    placeholder="Any extra info, setlist notes, who's bringing what..."
                    formControlName="description">
                </textarea>
            </mat-form-field>
        </div>
    </div>

    <mat-divider></mat-divider>

    <!-- ACTIONS -->
    <div class="event-card-actions">
        <div class="left-actions">
            <button
                mat-raised-button
                color="primary"
                type="submit"
                [disabled]="form.invalid">
                {{ action === 'Add' ? 'Create Session' : 'Save Changes' }}
            </button>

            <button
                mat-raised-button
                color="accent"
                class="dalmatian"
                type="button"
                (click)="close()">
                Cancel
            </button>
        </div>

        <div class="right-actions" *ngIf="form.get('id')?.value">
            <button
                mat-stroked-button
                color="warn"
                type="button"
                (click)="onArchive()">
                Delete Session
            </button>
        </div>
    </div>
</form>
