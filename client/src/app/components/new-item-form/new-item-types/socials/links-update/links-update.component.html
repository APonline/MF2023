<div class="popup content mf-theme mf-contact-dialog">
    <!-- HEADER (non-delete) -->
    <div class="contact-header" *ngIf="action !== 'Delete'">
        <div class="avatar-ring">
            <div class="avatar-circle">
                <span>🔗</span>
            </div>
        </div>

        <div class="header-text">
            <h2>{{ action === 'Add' ? 'Add Link' : 'Edit Link' }}</h2>
            <p>
                Save useful URLs for this artist – websites, tools, docs, finance,
                socials, anything the band needs quick access to.
            </p>
        </div>
    </div>

    <div class="contact-divider" *ngIf="action !== 'Delete'"></div>

    <!-- MAIN CONTENT (non-delete) -->
    <ng-container *ngIf="action !== 'Delete'; else deleteTemplate">
        <div class="contact-grid">
            <!-- LINK DETAILS -->
            <div class="section-label">Link details</div>

            <!-- row 1: title -->
            <div class="field-row single">
                <div class="field-with-label">
                    <span class="field-label">Title</span>
                    <mat-form-field appearance="fill">
                        <input
                            matInput
                            [(ngModel)]="local_data[0]['title']"
                            placeholder="e.g. Band Website, QuickBooks, Dropbox"
                        />
                    </mat-form-field>
                </div>
            </div>

            <!-- row 2: URL -->
            <div class="field-row single">
                <div class="field-with-label">
                    <span class="field-label">URL</span>
                    <mat-form-field appearance="fill">
                        <input
                            matInput
                            [(ngModel)]="local_data[0]['url']"
                            placeholder="https://..."
                        />
                    </mat-form-field>
                </div>
            </div>

            <!-- row 4: notes / description -->
            <div class="field-row single">
                <div class="field-with-label">
                    <span class="field-label">
                        Notes
                        <span class="hint-text">(optional)</span>
                    </span>
                    <mat-form-field appearance="fill">
                        <textarea
                            matInput
                            rows="3"
                            [(ngModel)]="local_data[0]['description']"
                            placeholder="What is this link used for? (e.g. accounting, tour files, press kit)"
                        ></textarea>
                    </mat-form-field>
                </div>
            </div>
        </div>

        <mat-divider class="contact-divider"></mat-divider>

        <div class="contact-actions" mat-dialog-actions>
            <div class="left-actions">
                <button
                    mat-raised-button
                    color="primary"
                    (click)="doAction()"
                >
                    {{ action === 'Add' ? 'Create Link' : 'Save Changes' }}
                </button>

            <button
                    mat-raised-button
                    color="accent"
                    class="dalmatian"
                    (click)="closeDialog()"
                >
                    Cancel
                </button>
            </div>

            <span class="actions-spacer"></span>

            <div class="right-actions" *ngIf="modUser">
                <button
                    mat-stroked-button
                    color="warn"
                    class="archive"
                    (click)="archiveContact()"
                >
                    Remove Link
                </button>
            </div>
        </div>
    </ng-container>

    <!-- DELETE STATE -->
    <ng-template #deleteTemplate>
        <div class="delete-content">
            <h2>Remove Link</h2>
            <p>Are you sure you want to remove this link from the artist's toolkit?</p>

            <div class="contact-actions" mat-dialog-actions>
                <button
                    mat-raised-button
                    color="warn"
                    class="primary"
                    (click)="doAction()"
                >
                    {{ action }}
                </button>

                <button
                    mat-stroked-button
                    class="ghost"
                    (click)="closeDialog()"
                >
                    Cancel
                </button>
            </div>
        </div>
    </ng-template>
</div>
