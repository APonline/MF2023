on:
  push:
    branches:
      - main

name: Build Muse Factory 2024
jobs:
  build:
    runs-on: self-hosted
    strategy:
      matrix:
        node-version: [20.x]

    steps:
      - name: Checkout Repo
        uses: actions/checkout@v1

      - name: Cache node modules
        uses: actions/cache@v4
        with:
          path: |
            ~/cache
            !~/cache/exclude
            **/node_modules
          key: ${{ runner.os }}-node-${{ hashFiles('**/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-node-

      - name: Node ${{ matrix.node-version }}
        uses: actions/setup-node@v1
        with:
          node-version: ${{ matrix.node-version }}

      - name: npm install and npm run build
        run: |
          cd client/
          npm i --legacy-peer-deps
          npm run build:production

      - name: npm install and run backend
        run: |
          cd server/
          npm i

      - name: Debug paths and timestamps
        run: |
          pwd
          ls -la
          ls -la client/dist || true
          echo "LATEST build file:"
          find client/dist -type f -printf '%TY-%Tm-%Td %TH:%TM:%TS %p\n' 2>/dev/null | sort | tail -5 || true

